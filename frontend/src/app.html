<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Deus Vault</title>
		<link rel="icon" href="/logo.png" type="image/png" />
		<link rel="apple-touch-icon" href="/logo.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#0a0a12" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Deus Vault" />
		<!-- Tarjeta al compartir (WhatsApp, Telegram…). Para /link/* el backend
		     sustituye estos valores por los de la invitación. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Deus Vault" />
		<meta property="og:title" content="Deus Vault" />
		<meta property="og:description" content="Tu bóveda de contenido por consumir. Memento mori." />
		<!-- Relativas a propósito: el dominio no se conoce en build y WhatsApp/Telegram
		     las resuelven. Para /link/* el backend las pone absolutas con el host real. -->
		<meta property="og:image" content="/og.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Deus Vault" />
		<meta name="twitter:description" content="Tu bóveda de contenido por consumir. Memento mori." />
		<meta name="twitter:image" content="/og.jpg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
